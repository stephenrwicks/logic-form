<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../logic-form.css">
  <script src="../logic-form.js"></script>

</head>

<body>
<logic-form id="demo" data-config='{
  "title": "Contact the Library",
  "fields": [
    {
      "type": "textbox",
      "name": "name",
      "label": "Name",
      "placeholder": "Enter your name",
      "required": true
    },
    {
      "type": "textbox",
      "name": "email",
      "label": "Email Address",
      "placeholder": "you@example.com",
      "required": true
    },
    {
      "type": "select",
      "name": "reason",
      "label": "What can we help you with?",
      "options": [
        { "text": "-", "value": "" },
        { "text": "Books & Materials", "value": "materials" },
        { "text": "Technology", "value": "technology" },
        { "text": "Programs & Events", "value": "programs" }
      ],
      "required": true
    },

    {
      "type": "select",
      "name": "materialHelp",
      "label": "What do you need help with?",
      "options": [
        { "text": "Renew an Item", "value": "renew" },
        { "text": "Interlibrary Loan", "value": "ill" },
        { "text": "Lost Item", "value": "lost" }
      ],
      "visible": [{"field": "reason"}, "==", "materials"],
      "required": [{"field": "reason"}, "==", "materials"]
    },

    {
      "type": "numerictextbox",
      "name": "renewLibraryCard",
      "label": "Library Card Number",
      "placeholder": "Enter your library card number",
      "visible": {
        "and": [
          [{"field": "reason"}, "==", "materials"],
          [{"field": "materialHelp"}, "==", "renew"]
        ]
      },
      "required": {
        "and": [
          [{"field": "reason"}, "==", "materials"],
          [{"field": "materialHelp"}, "==", "renew"]
        ]
      }
    },
    {
      "type": "list",
      "name": "renewItems",
      "label": "Items to Renew",
      "min": 1,
      "max": 10,
      "visible": {
        "and": [
          [{"field": "reason"}, "==", "materials"],
          [{"field": "materialHelp"}, "==", "renew"],
          [{"field": "renewAll"}, "==", false]
        ]
      },
      "required": {
        "and": [
          [{"field": "reason"}, "==", "materials"],
          [{"field": "materialHelp"}, "==", "renew"],
          [{"field": "renewAll"}, "==", false]
        ]
      }
    },
    {
      "type": "checkbox",
      "name": "renewAll",
      "label": "Renew all items",
      "visible": {
        "and": [
          [{"field": "reason"}, "==", "materials"],
          [{"field": "materialHelp"}, "==", "renew"]
        ]
      }
    },

    {
      "type": "textbox",
      "name": "illLibraryCard",
      "label": "Library Card Number",
      "placeholder": "Enter your library card number",
      "visible": {
        "and": [
          [{"field": "reason"}, "==", "materials"],
          [{"field": "materialHelp"}, "==", "ill"]
        ]
      },
      "required": {
        "and": [
          [{"field": "reason"}, "==", "materials"],
          [{"field": "materialHelp"}, "==", "ill"]
        ]
      }
    },
    {
      "type": "list",
      "name": "illItems",
      "label": "Items to Request",
      "min": 1,
      "max": 10,
      "visible": {
        "and": [
          [{"field": "reason"}, "==", "materials"],
          [{"field": "materialHelp"}, "==", "ill"]
        ]
      },
      "required": {
        "and": [
          [{"field": "reason"}, "==", "materials"],
          [{"field": "materialHelp"}, "==", "ill"]
        ]
      }
    },

    {
      "type": "textarea",
      "name": "lostItemDetails",
      "label": "Tell us about the lost item",
      "placeholder": "Enter the title, barcode, or any other information you have",
      "visible": {
        "and": [
          [{"field": "reason"}, "==", "materials"],
          [{"field": "materialHelp"}, "==", "lost"]
        ]
      },
      "required": {
        "and": [
          [{"field": "reason"}, "==", "materials"],
          [{"field": "materialHelp"}, "==", "lost"]
        ]
      }
    },

    {
      "type": "select",
      "name": "technologyHelp",
      "label": "What technology do you need help with?",
      "options": [
        { "text": "eBooks & eAudiobooks", "value": "ebooks" },
        { "text": "Library Catalog", "value": "catalog" },
        { "text": "Printing", "value": "printing" }
      ],
      "visible": [{"field": "reason"}, "==", "technology"],
      "required": [{"field": "reason"}, "==", "technology"]
    },

    {
      "type": "select",
      "name": "ebookProblem",
      "label": "What problem are you having?",
      "options": [
        { "text": "Cannot find or borrow an eBook", "value": "find" },
        { "text": "Cannot download an eBook", "value": "download" },
        { "text": "Cannot open an eBook", "value": "open" },
        { "text": "eBook has expired", "value": "expired" }
      ],
      "visible": {
        "and": [
          [{"field": "reason"}, "==", "technology"],
          [{"field": "technologyHelp"}, "==", "ebooks"]
        ]
      },
      "required": {
        "and": [
          [{"field": "reason"}, "==", "technology"],
          [{"field": "technologyHelp"}, "==", "ebooks"]
        ]
      }
    },
    {
      "type": "radiogroup",
      "name": "ebookDevice",
      "label": "What device are you using?",
      "options": [
        { "text": "iPhone / iPad", "value": "ios" },
        { "text": "Android", "value": "android" },
        { "text": "Kindle", "value": "kindle" },
        { "text": "Windows PC", "value": "windows" },
        { "text": "Mac", "value": "mac" }
      ],
      "visible": {
        "and": [
          [{"field": "reason"}, "==", "technology"],
          [{"field": "technologyHelp"}, "==", "ebooks"]
        ]
      }
    },
    {
      "type": "textarea",
      "name": "ebookDetails",
      "label": "eBook Details",
      "placeholder": {
        "if": [{"field": "ebookProblem"}, "==", "download"],
        "then": "Tell us what happens when you try to download the eBook...",
        "elseif": [
          {
            "if": [{"field": "ebookProblem"}, "==", "open"],
            "then": "Tell us what happens when you try to open the eBook..."
          },
          {
            "if": [{"field": "ebookProblem"}, "==", "expired"],
            "then": "Tell us which eBook has expired..."
          }
        ],
        "else": "Tell us what you are having trouble with..."
      },
      "visible": {
        "and": [
          [{"field": "reason"}, "==", "technology"],
          [{"field": "technologyHelp"}, "==", "ebooks"]
        ]
      },
      "required": {
        "and": [
          [{"field": "reason"}, "==", "technology"],
          [{"field": "technologyHelp"}, "==", "ebooks"]
        ]
      }
    },

    {
      "type": "select",
      "name": "catalogProblem",
      "label": "What are you having trouble with?",
      "options": [
        { "text": "Finding an item", "value": "find" },
        { "text": "Placing a hold", "value": "hold" },
        { "text": "Signing in", "value": "login" },
        { "text": "Understanding my search results", "value": "search" }
      ],
      "visible": {
        "and": [
          [{"field": "reason"}, "==", "technology"],
          [{"field": "technologyHelp"}, "==", "catalog"]
        ]
      },
      "required": {
        "and": [
          [{"field": "reason"}, "==", "technology"],
          [{"field": "technologyHelp"}, "==", "catalog"]
        ]
      }
    },
    {
      "type": "textbox",
      "name": "catalogSearch",
      "label": "What are you searching for?",
      "placeholder": "Title, author, subject, or ISBN",
      "visible": {
        "and": [
          [{"field": "reason"}, "==", "technology"],
          [{"field": "technologyHelp"}, "==", "catalog"],
          [{"field": "catalogProblem"}, "==", "find"]
        ]
      },
      "required": {
        "and": [
          [{"field": "reason"}, "==", "technology"],
          [{"field": "technologyHelp"}, "==", "catalog"],
          [{"field": "catalogProblem"}, "==", "find"]
        ]
      }
    },
    {
      "type": "textarea",
      "name": "catalogDetails",
      "label": "Catalog Details",
      "placeholder": {
        "if": [{"field": "catalogProblem"}, "==", "hold"],
        "then": "Tell us which item you are trying to place a hold on...",
        "elseif": [
          {
            "if": [{"field": "catalogProblem"}, "==", "login"],
            "then": "Describe what happens when you try to sign in..."
          },
          {
            "if": [{"field": "catalogProblem"}, "==", "search"],
            "then": "Tell us what you searched for and what you expected to find..."
          }
        ],
        "else": "Tell us more about the catalog problem..."
      },
      "visible": {
        "and": [
          [{"field": "reason"}, "==", "technology"],
          [{"field": "technologyHelp"}, "==", "catalog"],
          [{"field": "catalogProblem"}, "!=", ""]
        ]
      }
    },

    {
      "type": "select",
      "name": "printingProblem",
      "label": "What do you need help with?",
      "options": [
        { "text": "Printing from a library computer", "value": "computer" },
        { "text": "Printing from my own device", "value": "device" },
        { "text": "Scanning", "value": "scanning" },
        { "text": "Something is wrong with the printer", "value": "printer" }
      ],
      "visible": {
        "and": [
          [{"field": "reason"}, "==", "technology"],
          [{"field": "technologyHelp"}, "==", "printing"]
        ]
      },
      "required": {
        "and": [
          [{"field": "reason"}, "==", "technology"],
          [{"field": "technologyHelp"}, "==", "printing"]
        ]
      }
    },
    {
      "type": "textarea",
      "name": "printingDetails",
      "label": "Printing Details",
      "placeholder": "Describe what you are trying to print or scan...",
      "visible": {
        "and": [
          [{"field": "reason"}, "==", "technology"],
          [{"field": "technologyHelp"}, "==", "printing"],
          [{"field": "printingProblem"}, "!=", ""]
        ]
      },
      "required": {
        "and": [
          [{"field": "reason"}, "==", "technology"],
          [{"field": "technologyHelp"}, "==", "printing"]
        ]
      }
    },

    {
      "type": "select",
      "name": "program",
      "label": "Which program are you interested in?",
      "options": [
        { "text": "Book Club", "value": "bookclub" },
        { "text": "Lego Club", "value": "lego" }
      ],
      "visible": [{"field": "reason"}, "==", "programs"],
      "required": [{"field": "reason"}, "==", "programs"]
    },

    {
      "type": "checkboxgroup",
      "name": "bookInterests",
      "label": "Which types of books would you like to see in future Book Club selections?",
      "options": [
        { "text": "Mystery / Thriller", "value": "mystery" },
        { "text": "Historical Fiction", "value": "historical" },
        { "text": "Science Fiction", "value": "scifi" },
        { "text": "Romance", "value": "romance" },
        { "text": "Literary Fiction", "value": "literary" }
      ],
      "visible": {
        "and": [
          [{"field": "reason"}, "==", "programs"],
          [{"field": "program"}, "==", "bookclub"]
        ]
      }
    },

    {
      "type": "textbox",
      "name": "legoName",
      "label": "Child&apos;s Name",
      "placeholder": "Enter the child&apos;s name",
      "visible": {
        "and": [
          [{"field": "reason"}, "==", "programs"],
          [{"field": "program"}, "==", "lego"]
        ]
      },
      "required": {
        "and": [
          [{"field": "reason"}, "==", "programs"],
          [{"field": "program"}, "==", "lego"]
        ]
      }
    },
    {
      "type": "integer",
      "name": "legoAge",
      "label": "Child&apos;s Age",
      "min": 5,
      "max": 12,
      "visible": {
        "and": [
          [{"field": "reason"}, "==", "programs"],
          [{"field": "program"}, "==", "lego"]
        ]
      },
      "required": {
        "and": [
          [{"field": "reason"}, "==", "programs"],
          [{"field": "program"}, "==", "lego"]
        ]
      }
    },
    {
      "type": "textbox",
      "name": "legoContact",
      "label": "Parent / Guardian Name",
      "placeholder": "Enter a parent or guardian name",
      "visible": {
        "and": [
          [{"field": "reason"}, "==", "programs"],
          [{"field": "program"}, "==", "lego"]
        ]
      },
      "required": {
        "and": [
          [{"field": "reason"}, "==", "programs"],
          [{"field": "program"}, "==", "lego"]
        ]
      }
    },
    {
      "type": "checkbox",
      "name": "legoUpdates",
      "label": "Send me updates about future Lego Club meetings",
      "visible": {
        "and": [
          [{"field": "reason"}, "==", "programs"],
          [{"field": "program"}, "==", "lego"]
        ]
      }
    },

    {
      "type": "textarea",
      "name": "message",
      "label": "Additional Information",
      "placeholder": {
        "if": [{"field": "reason"}, "==", "materials"],
        "then": "Tell us anything else about the books or materials...",
        "elseif": [
          {
            "if": [{"field": "reason"}, "==", "technology"],
            "then": "Tell us anything else about your technology question..."
          },
          {
            "if": [{"field": "reason"}, "==", "programs"],
            "then": "Tell us anything else about the program or event..."
          }
        ],
        "else": "Tell us anything else we should know..."
      }
    }
  ]
}'>
</logic-form>


</body>

</html>
