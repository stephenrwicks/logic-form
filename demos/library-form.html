<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../logic-form.css">
  <script src="../logic-form.js"></script>

</head>

<body>

<logic-form
  id="demo"
  action="https://postman-echo.com/post"
  method="POST"
  data-config='{
  "title": "Contact the Library",
  "fields": [
    {
      "type": "textbox",
      "name": "name",
      "label": "Name",
      "value": "",
      "placeholder": "Enter your name",
      "required": true
    },
    {
      "type": "textbox",
      "name": "email",
      "label": "Email Address",
      "value": "",
      "placeholder": "you@example.com",
      "required": true
    },
    {
      "type": "select",
      "name": "reason",
      "label": "What can we help you with?",
      "value": "",
      "options": [
        { "text": "-", "value": "" },
        { "text": "Library Account", "value": "account" },
        { "text": "Books and Materials", "value": "materials" },
        { "text": "Technology Help", "value": "technology" },
        { "text": "Programs and Events", "value": "programs" },
        { "text": "Something Else", "value": "other" }
      ],
      "required": true
    },
    {
      "type": "select",
      "name": "accountIssue",
      "label": "What would you like to update?",
      "value": "",
      "options": [
        { "text": "-", "value": "" },
        { "text": "Mailing Address", "value": "address" },
        { "text": "Email Address", "value": "email" },
        { "text": "Phone Number", "value": "phone" },
        { "text": "Preferred Name", "value": "name" }
      ],
      "visible": ["reason", "==", "account"],
      "required": ["reason", "==", "account"]
    },
    {
      "type": "textbox",
      "name": "newAddress",
      "label": "New Mailing Address",
      "value": "",
      "placeholder": "Enter your new address",
      "visible": {
        "and": [
          ["reason", "==", "account"],
          ["accountIssue", "==", "address"]
        ]
      },
      "required": {
        "and": [
          ["reason", "==", "account"],
          ["accountIssue", "==", "address"]
        ]
      }
    },
    {
      "type": "textbox",
      "name": "newEmail",
      "label": "New Email Address",
      "value": "",
      "placeholder": "Enter your new email address",
      "visible": {
        "and": [
          ["reason", "==", "account"],
          ["accountIssue", "==", "email"]
        ]
      },
      "required": {
        "and": [
          ["reason", "==", "account"],
          ["accountIssue", "==", "email"]
        ]
      }
    },
    {
      "type": "textbox",
      "name": "newPhone",
      "label": "New Phone Number",
      "value": "",
      "placeholder": "Enter your new phone number",
      "visible": {
        "and": [
          ["reason", "==", "account"],
          ["accountIssue", "==", "phone"]
        ]
      },
      "required": {
        "and": [
          ["reason", "==", "account"],
          ["accountIssue", "==", "phone"]
        ]
      }
    },
    {
      "type": "textbox",
      "name": "newPreferredName",
      "label": "Preferred Name",
      "value": "",
      "placeholder": "Enter your preferred name",
      "visible": {
        "and": [
          ["reason", "==", "account"],
          ["accountIssue", "==", "name"]
        ]
      },
      "required": {
        "and": [
          ["reason", "==", "account"],
          ["accountIssue", "==", "name"]
        ]
      }
    },
    {
      "type": "select",
      "name": "materialIssue",
      "label": "What do you need help with?",
      "value": "",
      "options": [
        { "text": "-", "value": "" },
        { "text": "Find a Book or Other Material", "value": "find" },
        { "text": "Request an Item", "value": "request" },
        { "text": "Renew an Item", "value": "renew" },
        { "text": "Report a Missing or Damaged Item", "value": "damaged" }
      ],
      "visible": ["reason", "==", "materials"],
      "required": ["reason", "==", "materials"]
    },
    {
      "type": "textbox",
      "name": "materialSearch",
      "label": "What are you looking for?",
      "value": "",
      "placeholder": "Title, author, subject, or ISBN",
      "visible": {
        "and": [
          ["reason", "==", "materials"],
          ["materialIssue", "==", "find"]
        ]
      },
      "required": {
        "and": [
          ["reason", "==", "materials"],
          ["materialIssue", "==", "find"]
        ]
      }
    },
    {
      "type": "list",
      "name": "illRequests",
      "label": "Items You Would Like to Request",
      "value": [],
      "min": 1,
      "max": 5,
      "visible": {
        "and": [
          ["reason", "==", "materials"],
          ["materialIssue", "==", "request"]
        ]
      },
      "required": {
        "and": [
          ["reason", "==", "materials"],
          ["materialIssue", "==", "request"]
        ]
      }
    },
    {
      "type": "radiogroup",
      "name": "illFormat",
      "label": "Preferred Format",
      "value": "",
      "options": [
        { "text": "Print", "value": "print" },
        { "text": "Large Print", "value": "largeprint" },
        { "text": "DVD", "value": "dvd" },
        { "text": "CD / Audiobook", "value": "audio" }
      ],
      "visible": {
        "and": [
          ["reason", "==", "materials"],
          ["materialIssue", "==", "request"]
        ]
      },
      "required": {
        "and": [
          ["reason", "==", "materials"],
          ["materialIssue", "==", "request"]
        ]
      }
    },
    {
      "type": "textbox",
      "name": "renewalItem",
      "label": "Item to Renew",
      "value": "",
      "placeholder": "Title or barcode",
      "visible": {
        "and": [
          ["reason", "==", "materials"],
          ["materialIssue", "==", "renew"]
        ]
      },
      "required": {
        "and": [
          ["reason", "==", "materials"],
          ["materialIssue", "==", "renew"]
        ]
      }
    },
    {
      "type": "textbox",
      "name": "damagedItem",
      "label": "Missing or Damaged Item",
      "value": "",
      "placeholder": "Title or barcode",
      "visible": {
        "and": [
          ["reason", "==", "materials"],
          ["materialIssue", "==", "damaged"]
        ]
      },
      "required": {
        "and": [
          ["reason", "==", "materials"],
          ["materialIssue", "==", "damaged"]
        ]
      }
    },
    {
      "type": "select",
      "name": "technologyType",
      "label": "What kind of technology help do you need?",
      "value": "",
      "options": [
        { "text": "-", "value": "" },
        { "text": "Library Website", "value": "website" },
        { "text": "Library App", "value": "app" },
        { "text": "eBooks or eAudiobooks", "value": "ebooks" },
        { "text": "Public Computer", "value": "computer" },
        { "text": "Printing or Scanning", "value": "printing" },
        { "text": "Wi-Fi", "value": "wifi" }
      ],
      "visible": ["reason", "==", "technology"],
      "required": ["reason", "==", "technology"]
    },
    {
      "type": "select",
      "name": "ebookDevice",
      "label": "What device are you using?",
      "value": "",
      "options": [
        { "text": "-", "value": "" },
        { "text": "iPhone or iPad", "value": "ios" },
        { "text": "Android Phone or Tablet", "value": "android" },
        { "text": "Kindle", "value": "kindle" },
        { "text": "Windows Computer", "value": "windows" },
        { "text": "Mac", "value": "mac" },
        { "text": "Other", "value": "other" }
      ],
      "visible": {
        "and": [
          ["reason", "==", "technology"],
          ["technologyType", "==", "ebooks"]
        ]
      },
      "required": {
        "and": [
          ["reason", "==", "technology"],
          ["technologyType", "==", "ebooks"]
        ]
      }
    },
    {
      "type": "select",
      "name": "ebookProblem",
      "label": "What problem are you having?",
      "value": "",
      "options": [
        { "text": "-", "value": "" },
        { "text": "Cannot Download", "value": "download" },
        { "text": "Cannot Open", "value": "open" },
        { "text": "Cannot Sign In", "value": "login" },
        { "text": "Book Expired", "value": "expired" }
      ],
      "visible": {
        "and": [
          ["reason", "==", "technology"],
          ["technologyType", "==", "ebooks"]
        ]
      },
      "required": {
        "and": [
          ["reason", "==", "technology"],
          ["technologyType", "==", "ebooks"],
          ["ebookDevice", "!=", ""]
        ]
      }
    },
    {
      "type": "select",
      "name": "computerIssue",
      "label": "What is happening on the public computer?",
      "value": "",
      "options": [
        { "text": "-", "value": "" },
        { "text": "Cannot Log In", "value": "login" },
        { "text": "Computer Is Not Working", "value": "hardware" },
        { "text": "Internet Is Not Working", "value": "internet" },
        { "text": "Need Help Using Software", "value": "software" }
      ],
      "visible": {
        "and": [
          ["reason", "==", "technology"],
          ["technologyType", "==", "computer"]
        ]
      },
      "required": {
        "and": [
          ["reason", "==", "technology"],
          ["technologyType", "==", "computer"]
        ]
      }
    },
    {
      "type": "textbox",
      "name": "printingDocument",
      "label": "What are you trying to print or scan?",
      "value": "",
      "placeholder": "Describe the document or task",
      "visible": {
        "and": [
          ["reason", "==", "technology"],
          ["technologyType", "==", "printing"]
        ]
      },
      "required": {
        "and": [
          ["reason", "==", "technology"],
          ["technologyType", "==", "printing"]
        ]
      }
    },
    {
      "type": "textbox",
      "name": "wifiDevice",
      "label": "What device are you trying to connect?",
      "value": "",
      "placeholder": "Laptop, phone, tablet, etc.",
      "visible": {
        "and": [
          ["reason", "==", "technology"],
          ["technologyType", "==", "wifi"]
        ]
      },
      "required": {
        "and": [
          ["reason", "==", "technology"],
          ["technologyType", "==", "wifi"]
        ]
      }
    },
    {
      "type": "radiogroup",
      "name": "programName",
      "label": "Which program or event is this about?",
      "value": "",
      "options": [
        { "text": "Book Club", "value": "bookclub" },
        { "text": "Story Time", "value": "storytime" },
        { "text": "Computer Workshop", "value": "computerworkshop" },
        { "text": "Craft Program", "value": "crafts" },
        { "text": "Other Program", "value": "other" }
      ],
      "visible": ["reason", "==", "programs"],
      "required": ["reason", "==", "programs"]
    },
    {
      "type": "select",
      "name": "bookClubQuestion",
      "label": "What is your Book Club question?",
      "value": "",
      "options": [
        { "text": "-", "value": "" },
        { "text": "Next Meeting", "value": "meeting" },
        { "text": "Book Selection", "value": "book" },
        { "text": "Registration", "value": "registration" }
      ],
      "visible": {
        "and": [
          ["reason", "==", "programs"],
          ["programName", "==", "bookclub"]
        ]
      },
      "required": {
        "and": [
          ["reason", "==", "programs"],
          ["programName", "==", "bookclub"]
        ]
      }
    },
    {
      "type": "date",
      "name": "storyTimeDate",
      "label": "Preferred Story Time Date",
      "visible": {
        "and": [
          ["reason", "==", "programs"],
          ["programName", "==", "storytime"]
        ]
      },
      "required": {
        "and": [
          ["reason", "==", "programs"],
          ["programName", "==", "storytime"]
        ]
      }
    },
    {
      "type": "select",
      "name": "computerWorkshopLevel",
      "label": "What is your experience level?",
      "value": "",
      "options": [
        { "text": "-", "value": "" },
        { "text": "Beginner", "value": "beginner" },
        { "text": "Intermediate", "value": "intermediate" },
        { "text": "Advanced", "value": "advanced" }
      ],
      "visible": {
        "and": [
          ["reason", "==", "programs"],
          ["programName", "==", "computerworkshop"]
        ]
      },
      "required": {
        "and": [
          ["reason", "==", "programs"],
          ["programName", "==", "computerworkshop"]
        ]
      }
    },
    {
      "type": "textbox",
      "name": "craftSupply",
      "label": "What craft are you asking about?",
      "value": "",
      "placeholder": "Describe the craft or supplies",
      "visible": {
        "and": [
          ["reason", "==", "programs"],
          ["programName", "==", "crafts"]
        ]
      },
      "required": {
        "and": [
          ["reason", "==", "programs"],
          ["programName", "==", "crafts"]
        ]
      }
    },
    {
      "type": "textarea",
      "name": "message",
      "label": "Message",
      "value": "",
      "placeholder": "Tell us anything else we should know",
      "visible": {
        "or": [
          {
            "and": [
              ["reason", "==", "account"],
              ["accountIssue", "!=", ""]
            ]
          },
          {
            "and": [
              ["reason", "==", "materials"],
              ["materialIssue", "!=", ""]
            ]
          },
          {
            "and": [
              ["reason", "==", "technology"],
              ["technologyType", "!=", ""]
            ]
          },
          {
            "and": [
              ["reason", "==", "programs"],
              ["programName", "!=", ""]
            ]
          },
          ["reason", "==", "other"]
        ]
      },
      "required": true
    }
  ]
}'>
</logic-form>

  <script>
    const x = document.querySelector('logic-form');
    x.addEventListener('logic-form-update', (e) => {
      console.log(e.detail);
    })

  </script>
  <!-- <script src="demos/formbuilderconfigs.js"></script>
  <script src="demos/formbuilder.js"></script> -->
</body>

</html>
