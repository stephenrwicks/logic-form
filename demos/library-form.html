<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../logic-form.css">
  <script src="../logic-form.js"></script>

</head>

<body>

<logic-form
  id="demo"
  data-config='{
    "title": "Disable Field B Unless Options A and B Are Selected",
    "fields": [
      {
        "type": "checkboxgroup",
        "name": "field A",
        "label": "Field A",
        "options": [
          { "text": "Option A", "value": "a" },
          { "text": "Option B", "value": "b" },
          { "text": "Option C", "value": "c" },
          { "text": "Option D", "value": "d" },
          { "text": "Option E", "value": "e" }
        ]
      },
      {
        "type": "textbox",
        "name": "field B",
        "label": "Field B",
        "disabled": {
          "not": {
            "and": [
              ["field A", "in", "a"],
              ["field A", "in", "b"]
            ]
          }
        }
      }
    ]
  }'>
</logic-form>

</body>

</html>
